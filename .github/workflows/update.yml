name: update

# The only writer of now.json / now.md (AGENTS.md §1).
#
# One pass over the allowlist (bounded cursor pagination, never an unbounded
# crawl), then render, then the gate. A failure at any step stops before the
# commit, so the last tagged snapshot keeps serving.
#
# Commit criterion: the item list or the rendered now.md, not the file bytes.
# `asOf` is regenerated on every run, so now.json always differs byte-wise;
# `scripts/changed.mjs` decides whether a row changed or the renderer now emits
# different markdown. Every snapshot commit then gets its own immutable tag on
# main, because a consumer can only pin a tag: an untagged commit is a snapshot
# nobody reads.

on:
  schedule:
    # Hourly is plenty; the timestamp is offset from the top of the hour.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tags are needed to decide whether v1.0.0 already exists.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch

      - name: Render now.md
        run: npm run render

      - name: Validate output
        run: npm run check

      - name: Commit if the items changed and cut v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # `asOf` changes on every run, so a byte diff would commit forever.
          # The criterion is the item list: 0 = changed, 1 = identical.
          if node scripts/changed.mjs; then
            git add -- now.json now.md
            git commit -m 'chore: update now snapshot'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo 'changed.mjs failed'
              exit "$status"
            fi
            echo 'item list unchanged; nothing to commit (asOf alone is not a change)'
          fi

          # Every snapshot commit carries its own tag: consumers pin tag +
          # digest, so an untagged snapshot is one nobody can consume. Cutting
          # only v1.0.0 (the previous behaviour) froze both consumers on
          # 2026-11-05 while this workflow kept committing (measured 2026-11-08).
          # A tag is never moved: an existing one is left immutable.
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo 'not on main; skipping tag'
            exit 0
          fi
          if [ "$(git log -1 --format=%s)" != 'chore: update now snapshot' ]; then
            echo 'HEAD is not a snapshot commit; skipping tag'
            exit 0
          fi
          if existing="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "HEAD already carries $existing; leaving it immutable"
            exit 0
          fi
          git fetch --quiet --tags origin
          TAG="$(node scripts/tag.mjs)"
          # HEAD, not GITHUB_SHA: this run may have just committed its own snapshot.
          git tag -a "$TAG" -m "now $TAG: snapshot $(git rev-parse --short HEAD)"
          git push origin "refs/tags/$TAG"
