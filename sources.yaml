# Allowlist of the sources the producer may read.
#
# This is not general YAML: the producer parses a strict subset (top-level
# `sources:` mapping, a sequence of `- id:` items, scalar fields). Unknown
# fields and unknown kinds are rejected rather than ignored.
#
# One request per source per run. No discovery, no retries, no redirects.

sources:
  # Latest release of each public repo on the account.
  # GraphQL: viewer.repositories(privacy: PUBLIC) + releases(last: 1).
  - id: releases
    kind: github-releases

  # PRs authored by the account that were merged upstream.
  # GraphQL: search(query: "is:pr is:merged author:...", first: 5).
  - id: upstream
    kind: github-prs
    query: "is:pr is:merged author:ChristianLuciani"
    first: 5
